quarkus.application.name=redis-resilient-initial-ms
quarkus.http.port=8085

# Deshabilitar health check automático de la extensión para evitar duplicación con RedisHealthCheck
quarkus.redis.health.enabled=false

# --- Conexión oficial hacia ToxiProxy (:6380) ---
quarkus.redis.hosts=redis://localhost:6380
quarkus.redis.max-pool-size=20
quarkus.redis.max-pool-waiting=32
quarkus.redis.timeout=2s
quarkus.redis.reconnect-attempts=3
quarkus.redis.reconnect-interval=500ms

# --- Umbrales de Resiliencia de la Aplicación ---
# Fuente única de verdad: tanto RedisPoolManager (reset de conexión) como el @CircuitBreaker
# de CacheService (abajo) leen estos mismos valores. Cambiar solo aquí.
app.redis.resilience.latency-threshold-ms=150
app.redis.resilience.consecutive-delays-threshold=3
app.redis.resilience.reconnect-cooldown-ms=15000
app.redis.resilience.admin-secret=${APP_REDIS_RESILIENCE_ADMIN_SECRET:supersecret123}

# --- Circuit Breaker de CacheService (claves de override de MicroProfile Fault Tolerance) ---
# @CircuitBreaker no puede leer @ConfigMapping directamente (sus parámetros son constantes de
# anotación), así que se deja sin argumentos en el código y se configura 100% desde aquí.
# requestVolumeThreshold=N + failureRatio=1.0 reproduce "N fallos consecutivos" con la ventana
# deslizante de MP Fault Tolerance: si los últimos N resultados fueron todos fallos, ratio=1.0
# sin importar qué hubo antes (la ventana ya descartó lo viejo) — igual que el contador de
# RedisPoolManager. "Global" (sin prefijo de clase/método) porque set() y get() comparten umbral.
CircuitBreaker/requestVolumeThreshold=${app.redis.resilience.consecutive-delays-threshold}
CircuitBreaker/failureRatio=1.0
CircuitBreaker/delay=${app.redis.resilience.reconnect-cooldown-ms}

# --- Health & Metrics ---
quarkus.smallrye-health.root-path=/health
quarkus.micrometer.enabled=true
